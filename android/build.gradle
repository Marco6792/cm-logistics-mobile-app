// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        googlePlayServicesVersion = "+"
        playServicesLocationVersion = "21.0.1"
        firebaseMessagingVersion = "22.0.0"
        firebaseVersion = "22.0.0"
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
        appCompatVersion = "1.4.2"
    }
    repositories {
        google()
        mavenCentral()

        maven {
            url "https://jitpack.io" // Or the correct repository URL for Flipper
        }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
        classpath('com.google.gms:google-services:4.3.15')
    }
}

allprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-')) {
                details.useVersion rootProject.ext.kotlinVersion
                details.because('Align Kotlin stdlib artifacts with the project Kotlin version')
            }
        }
    }

    repositories {
        google()
        mavenLocal()
        mavenCentral()
        maven { url 'https://maven.google.com' }
        maven { url 'https://repo1.maven.org/maven2' }
        // Required for react-native-background-geolocation local TransistorSoft artifacts
        maven { url("${project(':react-native-background-geolocation').projectDir}/android/libs") }
        // Required for react-native-background-fetch local TransistorSoft artifacts
        maven { url("${project(':react-native-background-geolocation').projectDir}/node_modules/react-native-background-fetch/android/libs") }
        maven { url 'https://developer.huawei.com/repo/' }
    }
}

apply plugin: "com.facebook.react.rootproject"